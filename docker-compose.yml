version: "3.9"

# ── Shared environment for all app services ───────────────────────────────────
x-app-env: &app-env
  SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
  JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me-in-production}"
  DEFAULT_TENANT_API_KEY: "${DEFAULT_TENANT_API_KEY:-}"
  # Persistence
  AUDIT_DB_DIR: /data
  JOBS_DB_DIR: /data
  REGISTRY_DB_PATH: /data/registry.db
  # Redis / Celery (optional async workers)
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  # Feature flags
  FLASK_ENV: production
  PYTHONUNBUFFERED: "1"

services:

  # ── API + dashboard ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    image: medical-data-validator:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *app-env
      PORT: "8000"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
    volumes:
      - validator_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Background job worker ────────────────────────────────────────────────────
  # The in-process worker in jobs.py handles the default SQLite queue.
  # When Celery is installed, replace CMD with a Celery worker:
  #   command: celery -A medical_data_validator.celery_app worker --loglevel=info
  worker:
    build:
      context: .
      target: runtime
    image: medical-data-validator:latest
    command: python -c "
      from medical_data_validator.jobs import _ensure_worker, _job_queue;
      import time;
      _ensure_worker();
      print('Worker started');
      [time.sleep(3600) for _ in iter(int, 1)]
      "
    environment:
      <<: *app-env
    volumes:
      - validator_data:/data
    depends_on:
      - api
    restart: unless-stopped

  # ── Redis (job broker + cache) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (optional; replaces SQLite for audit/registry/jobs) ────────────
  # To enable: uncomment and set AUDIT_DB_PATH / REGISTRY_DB_PATH to postgres DSNs
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: medical_validator
  #     POSTGRES_USER: "${POSTGRES_USER:-mdv}"
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdv}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ── Nginx reverse proxy (production profile) ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

volumes:
  validator_data:
    driver: local
  redis_data:
    driver: local
  # pg_data:
  #   driver: local
