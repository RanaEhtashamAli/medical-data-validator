name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[all,dev,test]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=medical_data_validator \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow and not integration" \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[all,dev,test]" pip-audit

      - name: Bandit — medium and above severity only
        run: bandit -r medical_data_validator/ -ll -q

      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable -q
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[all,dev,test]"

      - name: Flake8 — syntax errors and undefined names
        run: flake8 medical_data_validator/ --select=E9,F63,F7,F82 --show-source

      - name: Black format check
        run: black --check medical_data_validator/

      - name: isort check
        run: isort --check-only medical_data_validator/
